<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terminal Oculta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0d0d; color: #e1e1e6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background-color: #121214;
            border: 1px solid #222;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Cabecera */
        .chat-header {
            padding: 12px 16px;
            background-color: #16161a;
            border-bottom: 1px solid #26262c;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #444;
            background: #222;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-meta {
            display: flex;
            flex-direction: column;
        }
        .chat-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #f1f1f6;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .verified-badge { font-size: 0.75rem; color: #ff4757; }
        .chat-handle { font-size: 0.75rem; color: #888; }

        /* Área de mensajes */
        .chat-messages {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #121214;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 85%;
        }

        .message-row.bot {
            align-self: flex-start;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        /* Círculo de la miniatura de chat */
        .mini-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #2b2b36;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #3b3b4f;
        }
        .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Estilo SVG para el monigote clásico de usuario */
        .user-icon-svg {
            width: 18px;
            height: 18px;
            fill: #aaa;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .message-bubble {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            border: 1px solid #26262c;
        }

        .message-row.bot .message-bubble {
            background-color: #1b1b1f;
            color: #d1d1d6;
            border-top-left-radius: 2px;
        }

        .message-row.user .message-bubble {
            background-color: #2b2b36;
            color: #fff;
            border-color: #3b3b4f;
            border-top-right-radius: 2px;
        }

        .msg-time {
            font-size: 0.65rem;
            color: #666;
            padding: 0 2px;
        }
        .message-row.user .msg-time {
            text-align: right;
        }

        /* Zona de entrada */
        .chat-input-area {
            padding: 12px 16px;
            background-color: #16161a;
            border-top: 1px solid #26262c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #0d0d0d;
            border: 1px solid #2a2a32;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Cabecera -->
    <div class="chat-header">
        <div class="avatar-container">
            <img id="charAvatar" src="" alt="Avatar">
        </div>
        <div class="chat-meta">
            <div class="chat-title">
                <span id="charName">Cargando...</span>
                <span class="verified-badge">🔒</span>
            </div>
            <div class="chat-handle" id="charHandle">@desconocida</div>
        </div>
    </div>

    <!-- Mensajes -->
    <div class="chat-messages" id="chatMessages">
        <div class="message-row bot">
            <div class="mini-avatar" id="botMiniAvatarContainer">
                <img id="botMiniAvatar" src="" alt="Bot">
            </div>
            <div class="message-content">
                <div class="message-bubble">
                    *La pantalla parpadea tenuemente.*<br><br>
                    — Vaya, al fin lograste conectar. Tengo algo importante para ti protegido bajo un cifrado.<br><br>
                    🔒 <b>Mensaje Cifrado:</b> <span style="color: #ff5252;">KHOOR</span><br><br>
                    <span style="font-size: 0.8rem; color: #aaa;">(Escribe <b>/desencriptar [texto] [saltos]</b> o <b>/pista</b>).</span>
                </div>
                <div class="msg-time" id="currentTimeBot">14:51</div>
            </div>
        </div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Escribe un mensaje o comando..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const identidadesOcultas = [
        { nombre: "miku nakano", handle: "@L_lawliet", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" },
        { nombre: "E.S.N.V.", handle: "@sombras_silenciosas", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" },
        { nombre: "Kanon_R", handle: "@signal_lost_404", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80" },
        { nombre: "Vanesa.sys", handle: "@oculta_en_red", avatar: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=150&auto=format&fit=crop&q=80" }
    ];

    let avatarActualURL = "";

    window.onload = function() {
        let elegido = identidadesOcultas[Math.floor(Math.random() * identidadesOcultas.length)];
        document.getElementById('charName').innerText = elegido.nombre;
        document.getElementById('charHandle').innerText = elegido.handle;
        document.getElementById('charAvatar').src = elegido.avatar;
        document.getElementById('botMiniAvatar').src = elegido.avatar;
        avatarActualURL = elegido.avatar;

        let now = new Date();
        let timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        document.getElementById('currentTimeBot').innerText = timeStr;
    };

    function caesarCipher(str, shift) {
        return str.split('').map(char => {
            let code = char.charCodeAt(0);
            if (code >= 65 && code <= 90) return String.fromCharCode(((code - 65 - shift + 26) % 26) + 65);
            if (code >= 97 && code <= 122) return String.fromCharCode(((code - 97 - shift + 26) % 26) + 97);
            return char;
        }).join('');
    }

    function appendMessage(htmlContent, isUser = false) {
        let chatMessages = document.getElementById('chatMessages');
        let row = document.createElement('div');
        row.className = `message-row ${isUser ? 'user' : 'bot'}`;

        let miniAvatar = document.createElement('div');
        miniAvatar.className = 'mini-avatar';

        if (isUser) {
            // Dibujo clásico de usuario (silueta de bolita y cuerpo)
            miniAvatar.innerHTML = `<svg class="user-icon-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
        } else {
            let img = document.createElement('img');
            img.src = avatarActualURL;
            miniAvatar.appendChild(img);
        }

        let content = document.createElement('div');
        content.className = 'message-content';

        let bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = htmlContent;

        let now = new Date();
        let timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        let timeDiv = document.createElement('div');
        timeDiv.className = 'msg-time';
        timeDiv.innerText = timeStr;

        content.appendChild(bubble);
        content.appendChild(timeDiv);

        row.appendChild(miniAvatar);
        row.appendChild(content);

        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
        let input = document.getElementById('userInput');
        let text = input.value.trim();
        if (!text) return;

        appendMessage(text, true);
        input.value = '';

        setTimeout(() => {
            let lower = text.toLowerCase();
            let currentName = document.getElementById('charName').innerText;

            if (lower.startsWith('/desencriptar ')) {
                let parts = text.slice(14).trim().split(' ');
                let targetText = parts[0];
                let shift = parseInt(parts[1]);

                if (!targetText || isNaN(shift)) {
                    appendMessage(`⚠️ Formato incorrecto. Usa: <code>/desencriptar [texto] [saltos]</code>`);
                    return;
                }

                let decoded = caesarCipher(targetText, shift);
                appendMessage(`⚙️ <b>Resultado (${shift} saltos):</b><br><code style="color: #4ade80;">${decoded}</code>`);
                
                if (decoded.toUpperCase() === "HOLA") {
                    appendMessage(`*Ella sonríe levemente.*<br><br>— Has superado el acceso de ${currentName}.`);
                }
            } 
            else if (lower === '/pista') {
                appendMessage(`💡 <b>Adivinanza:</b><br><i>"Tengo cuatro esquinas exactas y simétricas, ningún rodeo innecesario, y si miras las dimensiones de una habitación cuadrada básica, hallarás el salto oculto."</i><br><br><span style="color: #fbbf24; font-size: 0.8rem;">(Pista numérica: Piensa en el número 4).</span>`);
            }
            else {
                appendMessage(`— No entiendo ese comando. Usa <b>/pista</b> o <b>/desencriptar [texto] [saltos]</b>.`);
            }
        }, 600);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
